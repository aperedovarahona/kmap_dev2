<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <clipPath id="avatarCircle">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba" />
      <stop offset="100%" stop-color="#f5c6a5" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Border Ring -->
  <circle cx="50" cy="50" r="47" stroke="#00e5ff" stroke-width="2.5" fill="#0b172a" />

  <!-- Avatar Artwork clipped -->
  <g clip-path="url(#avatarCircle)">
    <!-- Background -->
    <rect width="100" height="100" fill="url(#bgGrad)" />

    <!-- Jacket / Collar -->
    <path d="M 20 100 L 35 75 L 50 85 L 65 75 L 80 100 Z" fill="#111" />
    <path d="M 35 75 L 50 92 L 65 75 Z" fill="#38ef7d" opacity="0.8" />
    <!-- Neck -->
    <rect x="42" y="60" width="16" height="18" fill="url(#skinGrad)" />

    <!-- Face -->
    <path d="M 32 45 Q 32 72 50 74 Q 68 72 68 45 Z" fill="url(#skinGrad)" />

    <!-- Eyes (Anime style) -->
    <ellipse cx="42" cy="52" rx="3.5" ry="5" fill="#1a1a2e" />
    <circle cx="43" cy="50" r="1.5" fill="#ffffff" />
    <ellipse cx="58" cy="52" rx="3.5" ry="5" fill="#1a1a2e" />
    <circle cx="59" cy="50" r="1.5" fill="#ffffff" />

    <!-- Hair (Anime spike bangs) -->
    <!-- Back Hair -->
    <path d="M 25 50 Q 20 25 50 20 Q 80 25 75 50 Z" fill="#1c202a" />
    <!-- Front Bangs -->
    <path d="M 26 38 Q 40 45 42 55 Q 43 45 48 57 Q 52 46 56 56 Q 60 45 74 38 Q 65 24 50 22 Q 35 24 26 38 Z" fill="#2d3748" />
    <path d="M 34 32 L 40 46 L 46 30 L 52 48 L 60 32 L 66 45 L 70 34" stroke="#1a202c" stroke-width="2" />
  </g>

  <!-- Green Active Dot -->
  <circle cx="80" cy="80" r="7.5" fill="#00e676" stroke="#081020" stroke-width="2.5" filter="url(#glowGreen)" />
</svg>
