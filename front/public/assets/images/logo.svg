<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Book Icon Group -->
  <g transform="translate(5, 5)">
    <!-- Book Left Page -->
    <path d="M 28 48 C 18 44, 8 45, 2 48 L 2 18 C 8 15, 18 14, 28 18 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)" opacity="0.95"/>
    <path d="M 28 42 C 18 39, 8 40, 4 43 L 4 21 C 9 18, 18 17, 28 21 Z" fill="#001838" opacity="0.6"/>
    
    <!-- Book Right Page -->
    <path d="M 32 48 C 42 44, 52 45, 58 48 L 58 18 C 52 15, 42 14, 32 18 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)" opacity="0.95"/>
    <path d="M 32 42 C 42 39, 52 40, 56 43 L 56 21 C 51 18, 42 17, 32 21 Z" fill="#001838" opacity="0.6"/>
    
    <!-- Spine / Center seam -->
    <line x1="30" y1="18" x2="30" y2="50" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Floating Pixel / Digital Blocks floating up-right -->
    <rect x="44" y="6" width="5" height="5" rx="1" fill="#00f2fe" filter="url(#neonGlow)"/>
    <rect x="52" y="3" width="6" height="6" rx="1.5" fill="#38ef7d" filter="url(#neonGlow)"/>
    <rect x="53" y="12" width="4.5" height="4.5" rx="1" fill="#00e5ff"/>
    <rect x="40" y="1" width="4" height="4" rx="1" fill="#00f2fe" opacity="0.75"/>
    <rect x="36" y="8" width="5" height="5" rx="1" fill="#00c6ff"/>
    <rect x="48" y="16" width="3.5" height="3.5" rx="1" fill="#00f2fe" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="75" y="32" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1.5">BIT</text>
  <text x="75" y="48" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#00d8f6" letter-spacing="2.8">ACADEMY</text>
</svg>
