<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" fill="none">
  <defs>
    <linearGradient id="kgCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0077fe" />
    </linearGradient>
    <filter id="kgNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Grafo de conocimiento cibernético (Nodos interconectados y libro digital) -->
  <g transform="translate(6, 7)">
    <!-- Conexiones / Aristas de red del grafo -->
    <line x1="18" y1="28" x2="34" y2="14" stroke="#00f2fe" stroke-width="2" opacity="0.85" filter="url(#kgNeonGlow)" />
    <line x1="34" y1="14" x2="52" y2="28" stroke="#00f2fe" stroke-width="2" opacity="0.85" filter="url(#kgNeonGlow)" />
    <line x1="34" y1="14" x2="34" y2="44" stroke="#00f2fe" stroke-width="2" opacity="0.75" />
    <line x1="18" y1="28" x2="34" y2="44" stroke="#0077fe" stroke-width="2" opacity="0.75" />
    <line x1="52" y1="28" x2="34" y2="44" stroke="#0077fe" stroke-width="2" opacity="0.75" />

    <!-- Libro / Base estructural de conocimiento -->
    <path d="M 14 38 C 22 34, 30 35, 34 38 C 38 35, 46 34, 54 38 L 54 48 C 46 44, 38 45, 34 48 C 30 45, 22 44, 14 48 Z" fill="url(#kgCyanGrad)" opacity="0.4" />

    <!-- Nodos del Grafo (Orbes Neón) -->
    <circle cx="34" cy="14" r="5.5" fill="#00f2fe" filter="url(#kgNeonGlow)" />
    <circle cx="34" cy="14" r="2.5" fill="#ffffff" />

    <circle cx="18" cy="28" r="4.5" fill="#00d2ff" filter="url(#kgNeonGlow)" />
    <circle cx="18" cy="28" r="2" fill="#ffffff" />

    <circle cx="52" cy="28" r="4.5" fill="#00d2ff" filter="url(#kgNeonGlow)" />
    <circle cx="52" cy="28" r="2" fill="#ffffff" />

    <circle cx="34" cy="44" r="5" fill="#9d50ff" filter="url(#kgNeonGlow)" />
    <circle cx="34" cy="44" r="2" fill="#ffffff" />

    <!-- Partículas orbitales ascendentes -->
    <circle cx="48" cy="8" r="1.8" fill="#00f2fe" opacity="0.85" />
    <circle cx="58" cy="16" r="2.2" fill="#38ef7d" filter="url(#kgNeonGlow)" />
  </g>

  <!-- Tipografía de Marca: KMapGraph -->
  <text x="76" y="38" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="900" font-size="25" fill="#ffffff" letter-spacing="0.5">KMap<tspan fill="#00f2fe" filter="url(#kgNeonGlow)">Graph</tspan></text>
  <text x="77" y="52" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#8da6c9" letter-spacing="2.6">APRENDIZAJE ADAPTATIVO</text>
</svg>
